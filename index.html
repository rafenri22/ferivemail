<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJA Mobile Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .verification-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .checkmark {
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
            animation: scaleUp 0.5s ease-in-out;
        }

        h1 {
            color: #1a237e;
            margin-bottom: 15px;
            font-size: 32px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: #4CAF50;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
        }

        .additional-info {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .contact-support {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
        }

        @keyframes scaleUp {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .verification-container {
                padding: 25px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="checkmark">✅</div>
        <h1>Verifikasi Email Berhasil!</h1>
        <p>
            Terima kasih telah memverifikasi alamat email Anda. Akun Anda kini telah sepenuhnya aktif dan siap digunakan. Anda dapat mulai menjelajahi semua fitur yang kami tawarkan.
        </p>
    
        <div class="additional-info">
            <p class="contact-support">
                Jika Anda memiliki pertanyaan, jangan ragu untuk menghubungi kami di
                <a href="mailto:rafkyferdian2574@gmail.com" style="color: #4CAF50; text-decoration: none;">
                    trijayaagung.co.id
                </a>
            </p>
        </div>
    </div>
</body>
</html>
